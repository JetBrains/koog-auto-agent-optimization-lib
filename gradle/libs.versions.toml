[versions]
kotlin = "2.3.0"
koog = "1.1.1"
# The Google client is published on a separate train; it is built against koog 1.1.1.
koog-google-client = "1.1.1-beta"
serialization = "1.9.0"
kotlin-logging = "7.0.3"
logback = "1.5.21"
dokka = "2.0.0"

[libraries]
koog = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-serialization = { module = "ai.koog:serialization-core", version.ref = "koog" }
koog-test = { module = "ai.koog:agents-test", version.ref = "koog" }
koog-google-client = { module = "ai.koog:prompt-executor-google-client", version.ref = "koog-google-client" }
kotlin-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
